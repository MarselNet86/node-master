# Lint and unit tests on the systems the script supports. The suite needs bash 4+ and GNU
# tools, so it runs in the images of the targets and not on a developer's Mac.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bats:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04", "debian:12"]
    container: ${{ matrix.image }}
    steps:
      - name: Install the test tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            bats shellcheck openssl gettext-base jq curl perl git ca-certificates procps iproute2

      - uses: actions/checkout@v5

      - name: shellcheck
        run: shellcheck -x deploy.sh check.sh lib/*.sh tests/*.bats

      - name: bats
        run: bats tests/
