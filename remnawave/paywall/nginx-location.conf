# The paywall path on a CDN origin (web-tech §3.1). The CDN resource passes any path to
# the origin, so the paywall rides the same edge and SNI as the node's own xhttp inbound,
# on its own path and xray port. Copy the node's tunnel snippet with the upstream renamed:
#   sed 's/xray_xhttp_cdn/xray_xhttp_paywall/' snippets/xray-xhttp-cdn.conf \
#     > snippets/xray-xhttp-paywall.conf
# then put the upstream at the http level and the location next to the node's tunnel one.

upstream xray_xhttp_paywall {
    server 127.0.0.1:4444;
    keepalive 64;
    keepalive_requests 100000;
    keepalive_timeout 300s;
}

# inside the 443 server block:
location = /api/v3.jpg {
    include snippets/xray-xhttp-paywall.conf;
}
